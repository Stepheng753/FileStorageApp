name: Tooth Manager CI/CD Pipeline

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    test:
        name: Run Tests & Verification
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
                  cache: 'pip'

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r Backend/requirements.txt pytest

            - name: Run Pytest Suite
              run: |
                  cd Backend
                  python -m pytest -v tests/
              env:
                  PYTHONPATH: .

    deploy:
        name: Deploy to Production VPS
        needs: test
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.PROD_HOST }}
                  username: ${{ secrets.PROD_USERNAME }}
                  key: ${{ secrets.PROD_SSH_KEY }}
                  port: ${{ secrets.PROD_PORT || 22 }}
                  script_stop: true
                  script: |
                      echo "🚀 Starting deployment on production server..."
                      cd /home/stepheng753/FileStorageApp

                      # Pull latest changes
                      echo "📥 Fetching and applying latest main branch..."
                      git fetch origin main
                      git reset --hard origin/main

                      # Verify storage directories and ownership
                      echo "📁 Verifying storage directories..."
                      mkdir -p Backend/static
                      mkdir -p Backend/database
                      chmod 755 Backend/static
                      sudo chown -R stepheng753:www-data Backend/static

                      # Update Python environment
                      echo "📦 Updating python virtual environment..."
                      source /home/stepheng753/FileStorageApp/.venv/bin/activate
                      pip install --upgrade pip
                      pip install -r Backend/requirements.txt gunicorn

                      # Ensure secrets exist
                      if [ ! -f Backend/secrets.json ]; then
                        echo "⚙️ Creating secrets.json from template..."
                        cp Backend/secrets.example.json Backend/secrets.json
                        chmod 600 Backend/secrets.json
                      fi

                      # Restart Gunicorn service without password prompt
                      echo "🔄 Restarting Gunicorn..."
                      sudo systemctl restart gunicorn

                      # Verify deployment health check
                      echo "🩺 Verifying endpoint..."
                      sleep 2
                      curl -s -f -I https://dev.toothmanager.com || exit 1
                      echo "✅ Deployment completed successfully!"
