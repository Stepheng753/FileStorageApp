name: Tooth Manager CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          cd Backend
          pytest -v tests/

  deploy:
    name: Deploy to Production VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting deployment on production server..."
            cd /home/stepheng753/FileStorageApp

            # Pull latest changes from git
            echo "📥 Pulling latest release from main branch..."
            git fetch origin main
            git reset --hard origin/main

            # Ensure static and database directories exist and permissions are maintained
            echo "📁 Verifying storage directories..."
            mkdir -p Backend/static
            mkdir -p Backend/database
            chmod 775 Backend/static || true

            # Activate production virtualenv and install dependencies
            echo "📦 Updating python virtual environment..."
            source /home/stepheng753/FileStorageApp/.venv/bin/activate
            pip install --upgrade pip
            pip install -r Backend/requirements.txt

            # Ensure secrets.json exists
            if [ ! -f Backend/secrets.json ]; then
              echo "⚙️ Creating secrets.json from template..."
              cp Backend/secrets.example.json Backend/secrets.json
            fi

            # Restart Gunicorn service
            echo "🔄 Restarting Gunicorn systemd service..."
            sudo systemctl restart gunicorn

            # Verify deployment health check
            echo "🩺 Verifying API health check..."
            sleep 2
            curl -s -f -k https://dev.toothmanager.com/api/health || curl -s -f http://127.0.0.1:3000/api/health || true
            echo "✅ Deployment completed successfully!"
