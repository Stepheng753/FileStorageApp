<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" href="../assets/tooth.png" />
		<link rel="stylesheet" href="../css/style.css" />
		<title>Tooth Manager - Log In</title>
	</head>
	<body>
		<div class="auth-wrapper">
			<div class="auth-card">
				<img src="../assets/tooth.png" alt="Tooth Logo" class="auth-logo" />
				<h1 class="auth-title">Tooth Manager</h1>
				<p class="auth-subtitle">Sign in to access practice files & documents</p>

				<form id="login-form">
					<div class="form-group">
						<label class="form-label" for="username">Username</label>
						<input
							type="text"
							id="username"
							name="username"
							class="form-control"
							placeholder="e.g. DR_HOANG"
							autocomplete="username"
							required
							autofocus
						/>
					</div>

					<div class="form-group">
						<label class="form-label" for="password">Password</label>
						<input
							type="password"
							id="password"
							name="password"
							class="form-control"
							placeholder="Enter your password"
							autocomplete="current-password"
							required
						/>
					</div>

					<button type="submit" class="btn btn-primary btn-block" id="login-btn" style="margin-top: 0.5rem;">
						Sign In
					</button>
				</form>

				<div class="auth-footer">
					Don't have an account? <a href="../register/register.html">Request Access</a>
				</div>
			</div>
		</div>

		<script src="../js/api.js"></script>
		<script src="./login.js"></script>
	</body>
</html>
