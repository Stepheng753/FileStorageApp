<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />
		<link rel="icon" href="../assets/tooth.png" />
		<link rel="stylesheet" href="../css/style.css?v=2.0.1" />
		<title>Tooth Manager - Documents & Files</title>
	</head>
	<body>
		<main class="main-wrapper">
			<!-- Top Toolbar: Breadcrumbs + Search -->
			<div class="toolbar-bar">
				<nav class="breadcrumbs" id="breadcrumbs-nav">
					<a href="#" class="breadcrumb-item active" data-folder="">Home</a>
				</nav>

				<div class="search-box">
					<span class="search-icon">🔍</span>
					<input
						type="text"
						id="file-search-input"
						class="search-input"
						placeholder="Search in this folder..."
						autocomplete="off"
					/>
				</div>
			</div>

			<!-- Dynamic Items Grid -->
			<div class="items-grid" id="items-grid">
				<div class="empty-state">
					<div class="empty-icon">📁</div>
					<h3 class="empty-title">Loading Files...</h3>
				</div>
			</div>

			<!-- Admin Action Dock (Fixed Bottom-Right) -->
			<div class="action-dock" id="admin-action-dock" style="display: none;">
				<button class="dock-btn btn-danger" id="dock-delete-btn" data-tooltip="Toggle Delete Mode">
					🗑️
				</button>
				<button class="dock-btn btn-secondary" id="dock-newfolder-btn" data-tooltip="Create New Folder">
					📁+
				</button>
				<button class="dock-btn btn-primary" id="dock-upload-btn" data-tooltip="Upload Files">
					⬆+
				</button>
			</div>
		</main>

		<!-- Upload Modal -->
		<div class="modal-overlay" id="upload-modal">
			<div class="modal-box">
				<div class="modal-header">
					<h3 class="modal-title">Upload Documents</h3>
					<button class="modal-close" id="upload-modal-close">&times;</button>
				</div>
				<form id="upload-form">
					<div class="dropzone" id="dropzone">
						<div class="dropzone-icon">☁️</div>
						<div class="dropzone-text">Drag & drop files here, or click to browse</div>
						<div class="dropzone-hint">Support for PDFs, Docs, Images, Spreadsheets up to 1 GB</div>
						<input type="file" id="file-picker" multiple style="display: none;" />
					</div>

					<div class="selected-files-list" id="selected-files-list"></div>

					<div class="form-group">
						<label class="form-label" for="target-folder-select">Upload Destination Folder</label>
						<select id="target-folder-select" class="form-control">
							<option value="">🏠 / (Root)</option>
						</select>
					</div>

					<div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
						<button type="button" class="btn btn-secondary" id="upload-cancel-btn">Cancel</button>
						<button type="submit" class="btn btn-primary" id="upload-submit-btn">Upload Files</button>
					</div>
				</form>
			</div>
		</div>

		<!-- Create Folder Modal -->
		<div class="modal-overlay" id="folder-modal">
			<div class="modal-box">
				<div class="modal-header">
					<h3 class="modal-title">Create New Folder</h3>
					<button class="modal-close" id="folder-modal-close">&times;</button>
				</div>
				<form id="folder-form">
					<div class="form-group" style="margin-bottom: 1.25rem;">
						<label class="form-label" for="folder-parent-select">Create Inside Folder</label>
						<select id="folder-parent-select" class="form-control">
							<option value="">🏠 / (Root)</option>
						</select>
						<p style="font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem;">
							Choose which folder will contain this new folder
						</p>
					</div>

					<div class="form-group">
						<label class="form-label" for="folder-name-input">New Folder Name</label>
						<input
							type="text"
							id="folder-name-input"
							class="form-control"
							placeholder="e.g. Consent Forms 2026"
							required
							autocomplete="off"
						/>
					</div>

					<div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
						<button type="button" class="btn btn-secondary" id="folder-cancel-btn">Cancel</button>
						<button type="submit" class="btn btn-primary" id="folder-submit-btn">Create Folder</button>
					</div>
				</form>
			</div>
		</div>

		<script src="../js/api.js?v=2.0.1"></script>
		<script src="../js/nav.js?v=2.0.1"></script>
		<script src="../js/modal.js?v=2.0.1"></script>
		<script src="./files.js?v=2.0.1"></script>
	</body>
</html>
