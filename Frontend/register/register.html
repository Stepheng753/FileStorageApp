<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" href="../assets/tooth.png" />
		<link rel="stylesheet" href="../css/style.css?v=2.0.1" />
		<title>Tooth Manager - Request Account</title>
	</head>
	<body>
		<div class="auth-wrapper">
			<div class="auth-card" id="register-card">
				<img src="../assets/tooth.png" alt="Tooth Logo" class="auth-logo" />
				<h1 class="auth-title">Tooth Manager</h1>
				<p class="auth-subtitle">Request staff access to Tooth Manager documents</p>

				<form id="register-form">
					<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
						<div class="form-group">
							<label class="form-label" for="firstname">First Name</label>
							<input type="text" id="firstname" name="firstname" class="form-control" placeholder="Jane" required />
						</div>
						<div class="form-group">
							<label class="form-label" for="lastname">Last Name</label>
							<input type="text" id="lastname" name="lastname" class="form-control" placeholder="Doe" required />
						</div>
					</div>

					<div class="form-group">
						<label class="form-label" for="username">Username</label>
						<input type="text" id="username" name="username" class="form-control" placeholder="e.g. jdoe" required />
					</div>

					<div class="form-group">
						<label class="form-label" for="password">Password</label>
						<input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 characters" required />
					</div>

					<div class="form-group">
						<label class="form-label" for="confirm-password">Confirm Password</label>
						<input type="password" id="confirm-password" name="confirm_password" class="form-control" placeholder="Re-enter password" required />
					</div>

					<p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1.25rem; text-align: left;">
						ℹ️ New accounts require approval from practice administration before document access is granted.
					</p>

					<button type="submit" class="btn btn-primary btn-block" id="register-btn">
						Submit Request
					</button>
				</form>

				<div class="auth-footer">
					Already have an account? <a href="../login/login.html">Sign In</a>
				</div>
			</div>
		</div>

		<script src="../js/api.js?v=2.0.1"></script>
		<script src="./register.js?v=2.0.1"></script>
	</body>
</html>
